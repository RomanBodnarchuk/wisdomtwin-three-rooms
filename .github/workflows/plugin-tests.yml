name: WisdomTwin plugin checks
on:
  pull_request:
    paths: ['plugin-scaffold/**', '.github/workflows/plugin-tests.yml']
  push:
    branches: ['cursor/wisdomtwin-mcp-plugin-8d09']
    paths: ['plugin-scaffold/**', '.github/workflows/plugin-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-scaffold
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: wisdomtwin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plugin-scaffold/requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pytest -q --tb=short
      - run: python -m pytest -q --tb=short
        env:
          WISDOMTWIN_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/wisdomtwin_test
      - run: python scripts/verify_local_worker.py
        env:
          WISDOMTWIN_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/wisdomtwin_test
          WISDOMTWIN_TEST_REDIS_URL: redis://127.0.0.1:6379/9
      - run: ./package.sh --check && ./package.sh --candidate
