<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0A0C" />
    <title>WisdomTwin Executive Huddle</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; min-height: 100%; background: #0A0A0C; color: #EAF6F4; font-family: ui-sans-serif, system-ui, sans-serif; }
      .wrap { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; gap: 12px; }
      p.kicker { letter-spacing: 0.22em; text-transform: uppercase; color: #C8A45D; font-size: 12px; margin: 0; }
      h1 { font-size: clamp(28px, 6vw, 44px); line-height: 1.1; margin: 8px 0; font-weight: 600; }
      p.sub { max-width: 36rem; color: #b7c4c2; margin: 0; }
      a.btn { display: inline-block; margin-top: 12px; padding: 14px 22px; background: #EAF6F4; color: #0A0A0C; text-decoration: none; border-radius: 16px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
      a.quiet { color: #4FD1C5; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <p class="kicker">WisdomTwin</p>
      <h1>Start Executive Huddle</h1>
      <p class="sub">Live 2:54 governed-decision film. Synthetic scenario. All people, organizations, metrics, and records are fictional.</p>
      <a class="btn" href="./">Open the interactive demo</a>
      <p class="sub">Canonical public page: <a class="quiet" href="https://www.wisdomtwin.ai/demo">wisdomtwin.ai/demo</a></p>
    </main>
  </body>
</html>
